[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[project]
name = "negotiation-arena"
version = "0.1.0"
description = "Trading/negotiation experiments"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "python-dotenv>=1.0.0",
  "seaborn>=0.13.2",
  "openai>=1.0.0",
  "python-dotenv==1.0.0",
  "matplotlib==3.7.3",
  "anthropic==0.5.0",
  "streamlit==1.28.2",
  "pre_commit",
  "google-generativeai",
]